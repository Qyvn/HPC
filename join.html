<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Create your High Performers Club member login after applying." />
  <link rel="canonical" href="https://highperformersclub.co.za/join" />
  <title>Create login — High Performers Club</title>
  <link rel="icon" type="image/png" href="public/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #000000;
      --line: rgba(192, 198, 208, 0.12);
      --line-strong: rgba(192, 198, 208, 0.32);
      --silver: #c8ced8;
      --silver-bright: #e8ecf2;
      --silver-dim: #8a919c;
      --ink: #f2f4f7;
      --muted: #9aa1ab;
      --display: "Michroma", "Eurostile", "Segoe UI", sans-serif;
      --body: "Inter", "Segoe UI", sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--body);
      color: var(--ink);
      background: radial-gradient(120% 80% at 50% -10%, #1a1c20 0%, var(--bg-deep) 55%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--silver); text-decoration: none; }
    a:hover { color: var(--silver-bright); }
    .wrap {
      max-width: 420px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--display);
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--silver-bright);
      margin-bottom: 40px;
    }
    .brand img { width: 28px; height: 28px; }
    h1 {
      margin: 0 0 10px;
      font-family: var(--display);
      font-size: clamp(1.2rem, 3vw, 1.55rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--silver-bright);
      line-height: 1.35;
    }
    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }
    .field { display: grid; gap: 10px; margin-bottom: 16px; }
    .field label {
      font-weight: 500;
      font-size: 9px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--silver-dim);
    }
    .field input {
      width: 100%;
      background: #060606;
      border: 1px solid var(--line-strong);
      color: var(--ink);
      padding: 14px 16px;
      min-height: 50px;
      border-radius: 0;
      font: inherit;
      outline: none;
    }
    .field input:focus {
      border-color: var(--silver);
      box-shadow: 0 0 0 1px rgba(200, 206, 216, 0.2);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      font-weight: 500;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      min-height: 48px;
      margin-top: 8px;
      background: linear-gradient(180deg, #f4f6f9 0%, #b7bfcb 100%);
      color: #080808;
      border: 1px solid #dce2ea;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .error {
      margin: 14px 0 0;
      color: #c9a0a0;
      font-size: 0.9rem;
      line-height: 1.45;
      display: none;
    }
    .error.is-on { display: block; }
    .ok {
      margin: 14px 0 0;
      color: var(--silver);
      font-size: 0.95rem;
      line-height: 1.55;
      display: none;
    }
    .ok.is-on { display: block; }
    .foot {
      margin-top: 22px;
      color: var(--silver-dim);
      font-size: 0.9rem;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/">
      <img src="public/assets/hpc-mark.png" width="28" height="28" alt="" />
      High Performers Club
    </a>
    <h1>Create login</h1>
    <p class="lead">Use the same email you applied with. Login unlocks when ops marks you Accepted.</p>
    <form id="join-form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required maxlength="80" />
      </div>
      <div class="field">
        <label for="email">Application email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="160" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
      </div>
      <button class="btn" type="submit" id="join-submit">Create login</button>
      <p class="error" id="join-error" role="alert"></p>
      <p class="ok" id="join-ok" role="status"></p>
    </form>
    <p class="foot">
      Already have a login? <a href="/login">Log in</a>.<br />
      Not applied yet? <a href="/#apply">Apply</a>.
    </p>
  </div>
  <script src="/public/member.js"></script>
  <script>
    (function () {
      const form = document.getElementById("join-form");
      const errorEl = document.getElementById("join-error");
      const okEl = document.getElementById("join-ok");
      const submit = document.getElementById("join-submit");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        errorEl.classList.remove("is-on");
        okEl.classList.remove("is-on");
        submit.disabled = true;
        submit.textContent = "Creating…";
        HpcMember.register(
          document.getElementById("name").value,
          document.getElementById("email").value,
          document.getElementById("password").value
        )
          .then(function (res) {
            if (!res.ok) {
              errorEl.textContent = (res.data && res.data.error) || "Could not create login.";
              errorEl.classList.add("is-on");
              return;
            }
            const member = res.data.member || {};
            if (member.status === "active") {
              okEl.textContent = "Login created. Taking you to Today…";
              okEl.classList.add("is-on");
              location.href = "/today";
              return;
            }
            okEl.textContent =
              (res.data.message || "Account created.") + " You can log in after acceptance.";
            okEl.classList.add("is-on");
            form.hidden = true;
          })
          .catch(function () {
            errorEl.textContent = "Could not create login just now.";
            errorEl.classList.add("is-on");
          })
          .finally(function () {
            submit.disabled = false;
            submit.textContent = "Create login";
          });
      });
    })();
  </script>
</body>
</html>
