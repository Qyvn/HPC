<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="High Performers Club — an elite athletic club for entrepreneurs, athletes, and operators who raise the standard." />
  <title>High Performers Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #050505;
  --bg-deep: #000000;
  --surface: #0e0e0e;
  --line: rgba(192, 198, 208, 0.14);
  --line-strong: rgba(192, 198, 208, 0.28);
  --silver: #c8ced8;
  --silver-bright: #e8ecf2;
  --silver-dim: #8a919c;
  --ink: #f2f4f7;
  --muted: #9aa1ab;
  --display: "Michroma", "Eurostile", "Segoe UI", sans-serif;
  --body: "Space Grotesk", "Segoe UI", sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  scroll-padding-top: 88px;
}
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--body);
  color: var(--ink);
  background: var(--bg-deep);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

.noise {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  opacity: 0.045;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.shell { position: relative; z-index: 1; }

/* Nav */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px clamp(20px, 4vw, 48px);
  background: linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,0));
  transition: background 0.4s var(--ease), backdrop-filter 0.4s var(--ease);
}
.nav.is-scrolled {
  background: rgba(5,5,5,.82);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.nav-brand {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--silver-bright);
}
.nav-cta {
  font-family: var(--display);
  font-size: clamp(7px, 2vw, 9px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 10px 14px;
  border: 1px solid var(--line-strong);
  color: var(--silver-bright);
  white-space: nowrap;
  transition: background 0.35s var(--ease), border-color 0.35s var(--ease), color 0.35s var(--ease);
}
.nav-cta:hover {
  background: var(--silver-bright);
  color: #050505;
  border-color: var(--silver-bright);
}

/* Hero */
.hero {
  position: relative;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  text-align: center;
  padding: clamp(88px, 12vh, 120px) 24px clamp(56px, 8vh, 80px);
  overflow: hidden;
  background: #000;
}
.hero-media {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.hero-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 28%;
  transform: scale(1.08);
  filter: grayscale(0.2) contrast(1.1) brightness(0.88);
  animation: kenburns 22s var(--ease) alternate infinite;
}
.hero-shade {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 50% 55% at 50% 40%, rgba(0,0,0,.42), transparent 68%),
    linear-gradient(180deg, rgba(0,0,0,.58) 0%, rgba(0,0,0,.28) 36%, rgba(0,0,0,.72) 100%),
    linear-gradient(90deg, rgba(0,0,0,.35) 0%, transparent 30%, transparent 70%, rgba(0,0,0,.4) 100%);
}
