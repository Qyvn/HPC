<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#050505" />
  <title>Applications — HPC Ops</title>
  <link rel="icon" type="image/png" href="/public/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --surface: #0d0d0d;
      --line: rgba(192, 198, 208, 0.14);
      --line-strong: rgba(192, 198, 208, 0.28);
      --silver: #c8ced8;
      --silver-bright: #e8ecf2;
      --silver-dim: #8a919c;
      --muted: #9aa1ab;
      --display: "Michroma", "Eurostile", "Segoe UI", sans-serif;
      --body: "Space Grotesk", "Segoe UI", sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--body);
      background: var(--bg);
      color: var(--silver);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--silver-bright); text-decoration: none; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }

    .gate, .app { min-height: 100dvh; }
    .gate {
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    .gate-card {
      width: min(400px, 100%);
      border: 1px solid var(--line-strong);
      background: var(--surface);
      padding: 32px 28px;
    }
    .gate-card img { width: 48px; height: 48px; margin-bottom: 20px; }
    .gate-card h1 {
      margin: 0 0 8px;
      font-family: var(--display);
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--silver-bright);
      font-weight: 400;
    }
    .gate-card p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .gate-card label {
      display: block;
      font-family: var(--display);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--silver-dim);
      margin-bottom: 10px;
    }
    .gate-card input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      background: #080808;
      border: 1px solid var(--line-strong);
      margin-bottom: 16px;
      outline: none;
    }
    .gate-card input:focus { border-color: var(--silver); }
    .gate-card .btn {
      width: 100%;
      min-height: 48px;
      font-family: var(--display);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #f4f6f9, #b7bfcb);
      color: #080808;
    }
    .gate-error {
      display: none;
      margin-top: 14px;
      color: #c9a0a0;
      font-size: 0.9rem;
    }
    .gate-error.is-on { display: block; }

    .top {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 20px clamp(16px, 4vw, 40px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(12px);
      z-index: 5;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img { width: 32px; height: 32px; }
    .brand strong {
      display: block;
      font-family: var(--display);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--silver-bright);
    }
    .brand span { color: var(--silver-dim); font-size: 0.85rem; }
    .top-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .ghost {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      font-family: var(--display);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--silver);
    }
    .ghost:hover { color: var(--silver-bright); border-color: var(--silver); }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--line);
      border-bottom: 1px solid var(--line);
    }
    @media (min-width: 800px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
    .stat {
      background: var(--bg);
      padding: 20px clamp(16px, 3vw, 28px);
    }
    .stat b {
      display: block;
      font-family: var(--display);
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: var(--silver-bright);
      font-weight: 400;
      margin-bottom: 6px;
    }
    .stat span {
      font-family: var(--display);
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--silver-dim);
    }

    .board {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 20px clamp(16px, 4vw, 40px) 48px;
    }
    @media (min-width: 960px) {
      .board { grid-template-columns: repeat(4, 1fr); align-items: start; }
    }
    .col {
      border: 1px solid var(--line);
      background: #080808;
      min-height: 220px;
    }
    .col-h {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--line);
    }
    .col-h h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--silver-bright);
      font-weight: 400;
    }
    .col-h span {
      font-family: var(--display);
      font-size: 9px;
      letter-spacing: 0.16em;
      color: var(--silver-dim);
    }
    .col-body { padding: 10px; display: grid; gap: 10px; }

    .card {
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 14px;
      display: grid;
      gap: 8px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: start;
    }
    .card h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--silver-bright);
      font-weight: 500;
      line-height: 1.35;
    }
    .lane {
      font-family: var(--display);
      font-size: 8px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--silver-dim);
      white-space: nowrap;
    }
    .card a { color: var(--silver); font-size: 0.9rem; }
    .card a:hover { color: var(--silver-bright); text-decoration: underline; }
    .why {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta {
      font-family: var(--display);
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--silver-dim);
    }
    .move {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line-strong);
      background: #0a0a0a;
      padding: 0 10px;
      font-size: 0.85rem;
      color: var(--silver);
    }

    .empty {
      padding: 28px 12px;
      text-align: center;
      color: var(--silver-dim);
      font-size: 0.9rem;
    }
    .status {
      padding: 12px clamp(16px, 4vw, 40px);
      color: var(--silver-dim);
      font-size: 0.9rem;
    }
    .status.is-error { color: #c9a0a0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="gate" id="gate">
    <form class="gate-card" id="gate-form">
      <img src="/public/assets/hpc-mark.png" width="48" height="48" alt="" />
      <h1>HPC Ops</h1>
      <p>Applications pipeline. Password required.</p>
      <label for="ops-pass">Password</label>
      <input id="ops-pass" type="password" autocomplete="current-password" required />
      <button class="btn" type="submit">Enter</button>
      <div class="gate-error" id="gate-error">Access denied.</div>
    </form>
  </div>

  <div class="app hidden" id="app">
    <header class="top">
      <div class="brand">
        <img src="/public/assets/hpc-mark.png" width="32" height="32" alt="" />
        <div>
          <strong>Applications</strong>
          <span id="sync-label">Loading…</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="ghost" type="button" id="refresh">Refresh</button>
        <a class="ghost" href="/" style="display:inline-flex;align-items:center;">Site</a>
        <button class="ghost" type="button" id="logout">Lock</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>
    <div class="status" id="status"></div>
    <div class="board" id="board"></div>
  </div>

  <script>
    const STAGES = [
      { id: "applied", label: "Applied" },
      { id: "reviewing", label: "Reviewing" },
      { id: "accepted", label: "Accepted" },
      { id: "declined", label: "Declined" },
    ];
    const STORE_KEY = "hpc-ops-stages-v1";
    const AUTH_KEY = "hpc-ops-basic";

    const gate = document.getElementById("gate");
    const app = document.getElementById("app");
    const gateForm = document.getElementById("gate-form");
    const gateError = document.getElementById("gate-error");
    const board = document.getElementById("board");
    const stats = document.getElementById("stats");
    const statusEl = document.getElementById("status");
    const syncLabel = document.getElementById("sync-label");

    let applications = [];
    let stageMap = loadStages();

    function loadStages() {
      try {
        return JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      } catch {
        return {};
      }
    }
    function saveStages() {
      localStorage.setItem(STORE_KEY, JSON.stringify(stageMap));
    }
    function stageOf(id) {
      return stageMap[id] || "applied";
    }
    function setStage(id, stage) {
      stageMap[id] = stage;
      saveStages();
      render();
    }

    function basicHeader() {
      return localStorage.getItem(AUTH_KEY) || "";
    }

    async function fetchApps() {
      statusEl.textContent = "";
      statusEl.classList.remove("is-error");
      syncLabel.textContent = "Syncing…";
      const res = await fetch("/.netlify/functions/applications", {
        headers: { Authorization: basicHeader() },
      });
      if (res.status === 401) {
        localStorage.removeItem(AUTH_KEY);
        showGate();
        throw new Error("Unauthorized");
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `Error ${res.status}`);
      }
      const data = await res.json();
      applications = data.applications || [];
      // Drop orphan stage keys quietly
      const ids = new Set(applications.map((a) => a.id));
      Object.keys(stageMap).forEach((id) => {
        if (!ids.has(id)) delete stageMap[id];
      });
      saveStages();
      syncLabel.textContent = `${applications.length} total · updated ${new Date().toLocaleTimeString()}`;
      render();
    }

    function render() {
      const counts = Object.fromEntries(STAGES.map((s) => [s.id, 0]));
      applications.forEach((a) => {
        counts[stageOf(a.id)] = (counts[stageOf(a.id)] || 0) + 1;
      });
      stats.innerHTML = STAGES.map(
        (s) => `<div class="stat"><b>${counts[s.id] || 0}</b><span>${s.label}</span></div>`
      ).join("");

      board.innerHTML = STAGES.map((s) => {
        const cards = applications.filter((a) => stageOf(a.id) === s.id);
        const body = cards.length
          ? cards
              .map((a) => {
                const when = a.createdAt
                  ? new Date(a.createdAt).toLocaleString(undefined, {
                      dateStyle: "medium",
                      timeStyle: "short",
                    })
                  : "";
                const options = STAGES.map(
                  (st) =>
                    `<option value="${st.id}" ${st.id === s.id ? "selected" : ""}>${st.label}</option>`
                ).join("");
                return `<article class="card" data-id="${a.id}">
                  <div class="card-top">
                    <h3>${escapeHtml(a.name || "Untitled")}</h3>
                    <span class="lane">${escapeHtml(a.lane || "—")}</span>
                  </div>
                  <a href="mailto:${escapeAttr(a.email)}">${escapeHtml(a.email)}</a>
                  <p class="why">${escapeHtml(a.why || "")}</p>
                  <div class="meta">${escapeHtml(when)}</div>
                  <select class="move" data-move="${a.id}" aria-label="Move application">${options}</select>
                </article>`;
              })
              .join("")
          : `<div class="empty">No applications</div>`;
        return `<section class="col">
          <div class="col-h"><h2>${s.label}</h2><span>${cards.length}</span></div>
          <div class="col-body">${body}</div>
        </section>`;
      }).join("");

      board.querySelectorAll("[data-move]").forEach((el) => {
        el.addEventListener("change", () => setStage(el.getAttribute("data-move"), el.value));
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, "&#39;");
    }

    function showGate() {
      gate.classList.remove("hidden");
      app.classList.add("hidden");
    }
    function showApp() {
      gate.classList.add("hidden");
      app.classList.remove("hidden");
    }

    gateForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      gateError.classList.remove("is-on");
      const pass = document.getElementById("ops-pass").value;
      const basic = "Basic " + btoa(`ops:${pass}`);
      localStorage.setItem(AUTH_KEY, basic);
      try {
        showApp();
        await fetchApps();
      } catch (err) {
        gateError.classList.add("is-on");
        showGate();
      }
    });

    document.getElementById("refresh").addEventListener("click", () => {
      fetchApps().catch((err) => {
        statusEl.textContent = err.message;
        statusEl.classList.add("is-error");
      });
    });
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem(AUTH_KEY);
      showGate();
    });

    if (basicHeader()) {
      showApp();
      fetchApps().catch(() => showGate());
    }
  </script>
</body>
</html>
